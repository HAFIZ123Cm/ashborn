<title>Ashborn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* Layout: an illuminated stage over a dark vellum text column, with a ledger sidebar that becomes a bottom sheet on phones */
:root{
  --void:#0b0809; --panel:#141011; --panel-2:#1c1517; --panel-3:#251c1d;
  --line:rgba(217,173,91,.20); --line-strong:rgba(217,173,91,.48);
  --ink:#ece2cf; --ink-dim:#ad9f8a; --ink-faint:#74685a;
  --ember:#ff7a3d; --blood:#c4293f; --gold:#d9ad5b; --hex:#a77bff; --frost:#79c4c7; --leaf:#8fcf86;
  --f-display:'Pirata One','UnifrakturCook',Georgia,serif;
  --f-body:'IM Fell English','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-label:'IM Fell English SC','IM Fell English',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(196,41,63,.20),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 110%,rgba(167,123,255,.10),transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
#bgfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.7}
.app{
  position:relative;z-index:1;max-width:1200px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;
}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 18px rgba(255,122,61,.35)}
.where{font-family:var(--f-label);font-size:15px;color:var(--ink-dim);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.where .dot{color:var(--ink-faint)}
.hud{font-family:var(--f-label);font-size:14px;color:var(--ink-dim);letter-spacing:.05em;display:none;gap:12px}
.hud b{color:var(--ink);font-weight:400}
.top-actions{margin-left:auto;display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-family:var(--f-label);font-size:14px;letter-spacing:.08em;color:var(--ink-dim);cursor:pointer;transition:border-color .2s,color .2s}
.ghost:hover,.ghost:focus-visible{border-color:var(--line-strong);color:var(--ink)}
#btnLedger{display:none}

/* ---------- stage ---------- */
.play{min-width:0;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;aspect-ratio:2/1;max-width:100%;overflow:hidden;background:#050304;border:1px solid var(--line-strong);outline:1px solid rgba(217,173,91,.12);outline-offset:4px;border-radius:2px;isolation:isolate}
.stage::before,.stage::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg);z-index:6;background:var(--void)}
.stage::before{top:-6px;left:calc(50% - 5px)}
.stage::after{bottom:-6px;left:calc(50% - 5px)}
.art{position:absolute;inset:-14px;transform:translate(var(--px,0px),var(--py,0px));transition:transform .6s ease-out}
.art .layer{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.art .layer.in{opacity:1}
.art svg{width:100%;height:100%;display:block;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.75));transition:background-color .15s}
.vig.hurt{background-color:rgba(196,41,63,.35)}
.vig.hit{background-color:rgba(255,240,200,.18)}
.slabel{position:absolute;left:14px;bottom:10px;z-index:4;display:flex;flex-direction:column;gap:0;text-shadow:0 1px 8px #000,0 0 2px #000;max-width:calc(100% - 28px)}
.sl-age{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.sl-t{font-family:var(--f-display);font-size:clamp(22px,4vw,34px);line-height:1.05;color:#fff4e0}
.stage.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.floats{position:absolute;inset:0;z-index:5;pointer-events:none}
.fnum{position:absolute;font-family:var(--f-display);font-size:34px;color:#fff;text-shadow:0 0 10px var(--ember),0 2px 4px #000;animation:fnum 1.1s ease-out forwards}
.fnum.you{color:#ffd0d6;text-shadow:0 0 10px var(--blood),0 2px 4px #000}
@keyframes fnum{from{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-6px) scale(1.15);opacity:1}to{transform:translateY(-60px) scale(1);opacity:0}}
.dice{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:6px;background:rgba(5,3,4,.55);backdrop-filter:blur(2px)}
.dnum{font-family:var(--f-display);font-size:86px;line-height:1;color:var(--ink);width:150px;height:150px;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(217,173,91,.18),transparent 70%);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);border:0;
  box-shadow:inset 0 0 0 2px var(--gold)}
.dice .dhex{position:relative;width:150px;height:150px}
.dice .dhex svg{position:absolute;inset:0}
.dice.rolling .dhex{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dcap{font-family:var(--f-label);letter-spacing:.1em;font-size:16px;color:var(--ink-dim);text-align:center;padding:0 12px}
.dice.ok .dnum{color:var(--gold);text-shadow:0 0 22px var(--ember)}
.dice.ok .dcap{color:var(--gold)}
.dice.bad .dnum{color:#ff6b7d;text-shadow:0 0 22px var(--blood)}
.dice.bad .dcap{color:#ff8b98}

/* ---------- story ---------- */
.story{background:linear-gradient(180deg,var(--panel),rgba(20,16,17,.92));border:1px solid var(--line);padding:22px clamp(16px,4vw,34px) 26px;position:relative;min-width:0}
.stitle{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.1;margin:0 0 12px;color:var(--gold);text-wrap:balance;display:none}
.stext{max-width:68ch;font-size:clamp(17px,2.2vw,19.5px)}
.stext p{margin:0 0 .85em}
.stext p:last-child{margin-bottom:0}
.stext em{color:var(--gold);font-style:italic}
.stext.scene>p:first-child::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.82;padding:.06em .1em 0 0;color:var(--ember);text-shadow:0 0 14px rgba(255,122,61,.4)}
.reveal p{opacity:0;animation:rise .7s ease forwards}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.reveal-c{opacity:0;animation:rise .6s ease forwards}
.story.instant .reveal p,.story.instant .reveal-c{animation-delay:0s!important;animation-duration:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:12px 16px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s;font-size:clamp(16px,2vw,18px);line-height:1.45}
.choice:hover:not([disabled]),.choice:focus-visible{background:var(--panel-3);border-color:var(--line-strong);transform:translateX(3px);outline:none}
.choice:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.choice .key{flex:none;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-label);font-size:14px;color:var(--gold);border:1px solid var(--line-strong);transform:rotate(45deg);margin-top:2px}
.choice .key span{transform:rotate(-45deg)}
.cbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.hint{font-family:var(--f-body);font-style:italic;font-size:15px;color:var(--ink-dim)}
.tag{font-family:var(--f-label);font-size:13.5px;letter-spacing:.08em;color:var(--ink-dim)}
.tag.chk{color:var(--frost)}
.tag.s-might{color:var(--ember)} .tag.s-cunning{color:var(--hex)} .tag.s-charm{color:var(--gold)} .tag.s-lore{color:var(--frost)}
.tag.fgt{color:#ff8b98}
.tag.lock{color:var(--ink-faint)}
.choice[disabled]{cursor:not-allowed;opacity:.5;background:transparent}
.choice[disabled] .key{color:var(--ink-faint);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:3px;padding:11px 22px;font-family:var(--f-label);font-size:17px;letter-spacing:.1em;cursor:pointer;color:var(--ink);transition:background .2s,box-shadow .2s}
.btn:hover,.btn:focus-visible{background:var(--panel-3);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,122,61,.18);outline:none}
.btn.primary{background:linear-gradient(180deg,#5a1a14,#3a0f0e);border-color:var(--ember);color:#ffe9d0}
.btn.primary:hover{box-shadow:0 0 0 1px var(--ember),0 0 26px rgba(255,122,61,.35)}
.verdict{font-family:var(--f-label);letter-spacing:.18em;font-size:14px;text-transform:uppercase;margin-bottom:8px}
.verdict.v-success{color:var(--gold)}
.verdict.v-failure{color:#ff8b98}
.outcome{border-left:2px solid var(--line-strong);padding-left:16px;font-style:italic;color:#e3d7c1}

/* ---------- combat ---------- */
.combat{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.cb-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cb-b{min-width:0}
.cb-n{font-family:var(--f-label);font-size:15px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-b.foe .cb-n{color:#ff9aa6}
.bar{height:10px;background:#0a0708;border:1px solid var(--line);margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a1424,var(--blood));transition:width .4s ease}
.cb-b.you .bar i{background:linear-gradient(90deg,#7a4a14,var(--gold))}
.cb-num{font-family:var(--f-label);font-size:13px;color:var(--ink-dim);margin-top:2px;font-variant-numeric:tabular-nums}
.cb-warn{font-family:var(--f-label);letter-spacing:.06em;font-size:15px;color:#ffb3a0;border:1px solid rgba(255,122,61,.5);background:rgba(255,122,61,.08);padding:8px 12px;animation:pls 1.2s ease-in-out infinite}
.cb-note{font-size:15px;font-style:italic;color:var(--hex)}
.cb-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:16px;color:var(--ink-dim);min-height:5.2em}
.cb-log li:last-child{color:var(--ink)}
.cb-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer;transition:background .2s,border-color .2s}
.act:hover:not([disabled]),.act:focus-visible{background:var(--panel-3);border-color:var(--line-strong);outline:none}
.act b{font-family:var(--f-label);font-weight:400;font-size:16px;letter-spacing:.08em}
.act span{font-size:13.5px;color:var(--ink-dim);line-height:1.3}
.act[disabled]{opacity:.42;cursor:not-allowed}
.act.a-strike b{color:var(--ember)} .act.a-feint b{color:var(--hex)} .act.a-guard b{color:var(--gold)} .act.a-arcane b{color:var(--frost)} .act.a-dark b{color:#c79bff} .act.a-draught b{color:var(--leaf)}
.cb-result{font-family:var(--f-display);font-size:30px;color:var(--gold)}
.cb-result.lost{color:#ff8b98}

/* ---------- ending ---------- */
.end-kind{font-family:var(--f-label);letter-spacing:.2em;text-transform:uppercase;font-size:14px}
.k-victory{color:var(--gold)} .k-dark{color:var(--hex)} .k-death{color:#ff8b98} .k-bitter{color:var(--frost)}
.end-title{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,54px);line-height:1;margin:6px 0 16px;color:var(--ink);text-wrap:balance}
.chron{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
.chron h4{font-family:var(--f-label);font-weight:400;letter-spacing:.12em;font-size:16px;color:var(--gold);margin:0}
.chron-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;font-size:15px}
.chron-grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.chron-grid span{color:var(--ink-dim)}
.chron ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15.5px;color:var(--ink-dim)}
.chron ol b{font-family:var(--f-label);font-weight:400;color:var(--gold);display:inline-block;min-width:64px}
.found{display:flex;flex-wrap:wrap;gap:6px}
.found span{font-family:var(--f-label);font-size:13px;letter-spacing:.05em;border:1px solid var(--line);padding:3px 8px;color:var(--ink-faint)}
.found span.got{color:var(--ink);border-color:var(--line-strong)}
.found span.got.k-victory{color:var(--gold)} .found span.got.k-dark{color:var(--hex)} .found span.got.k-death{color:#ff8b98} .found span.got.k-bitter{color:var(--frost)}

/* ---------- ledger ---------- */
.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);border:1px solid var(--line);padding:16px 16px 18px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
.lg-name{font-family:var(--f-display);font-size:28px;line-height:1.05;color:var(--ink);word-break:break-word}
.lg-title{font-style:italic;color:var(--ink-dim);font-size:15px}
.lg-cap{font-family:var(--f-label);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between}
.lg-cap .num{color:var(--ink-dim);letter-spacing:.04em;text-transform:none}
.hpbar{height:8px;background:#0a0708;border:1px solid var(--line);position:relative;overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a1424,var(--blood) 60%,#ff6b7d);transition:width .5s}
.stat{display:grid;grid-template-columns:72px 1fr 22px;align-items:center;gap:8px;font-size:15.5px;padding:2px 0}
.stat b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--line);flex:none}
.s-might .pips i.on{background:var(--ember);border-color:var(--ember)}
.s-cunning .pips i.on{background:var(--hex);border-color:var(--hex)}
.s-charm .pips i.on{background:var(--gold);border-color:var(--gold)}
.s-lore .pips i.on{background:var(--frost);border-color:var(--frost)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res div{background:var(--panel-2);border:1px solid var(--line);padding:6px 9px}
.res span{display:block;font-family:var(--f-label);font-size:12px;letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase}
.res b{font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.corr{grid-column:1/-1}
.corr .cbar{height:6px;background:#0a0708;margin-top:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.corr .cbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4b2a8a,var(--hex))}
.bond{display:flex;flex-direction:column;gap:3px;padding:4px 0}
.bond-top{display:flex;justify-content:space-between;gap:8px;font-size:15.5px}
.bond-top em{font-size:13px;color:var(--ink-dim)}
.bbar{height:5px;background:#0a0708;position:relative;border:1px solid var(--line)}
.bbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong)}
.bbar i{position:absolute;top:0;bottom:0}
.bbar i.pos{left:50%;background:var(--gold)}
.bbar i.neg{right:50%;background:var(--blood)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items span{font-size:14px;border:1px solid var(--line);padding:2px 8px;background:var(--panel-2)}
.items span.star{border-color:#6f7fd6;color:#cdd6ff}
.secrets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink-dim);font-style:italic}
.secrets li::before{content:"\2726  ";color:var(--gold);font-style:normal}
.empty{font-size:14px;color:var(--ink-faint);font-style:italic}
.sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}

/* ---------- title & chapter ---------- */
.titlescreen{position:fixed;inset:0;z-index:60;overflow:auto;background:var(--void)}
.ts-art{position:fixed;inset:0;opacity:.85}
.ts-art svg{width:100%;height:100%}
.ts-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,9,.2),rgba(11,8,9,.65) 55%,var(--void))}
.ts-inner{position:relative;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(48px,8vh) 48px;display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center}
.ts-kicker{font-family:var(--f-label);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-size:14px}
.ts-title{font-family:var(--f-display);font-weight:400;font-size:clamp(76px,17vw,150px);line-height:.85;margin:0;color:#fff1dc;text-shadow:0 0 30px rgba(255,122,61,.55),0 0 80px rgba(196,41,63,.45);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 40px rgba(255,122,61,.75),0 0 110px rgba(196,41,63,.6)}}
.ts-tag{max-width:46ch;margin:0;font-size:19px;color:#e6d9c2;text-wrap:balance}
.ts-form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;background:rgba(20,16,17,.82);border:1px solid var(--line-strong);padding:20px;text-align:left;backdrop-filter:blur(4px)}
.ts-form label[for],.ts-form legend{font-family:var(--f-label);letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--gold)}
.ts-form input[type=text]{background:#0c0909;border:1px solid var(--line-strong);color:var(--ink);font:inherit;font-size:20px;padding:8px 12px;border-radius:2px;width:100%}
.ts-form input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.sexpick{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap}
.sexpick legend{margin-bottom:6px}
.sexpick label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;cursor:pointer;font-size:17px;min-width:120px}
.sexpick label:has(input:checked){border-color:var(--ember);background:rgba(255,122,61,.08)}
.sexpick input{accent-color:var(--ember)}
.ts-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ts-btns .btn{flex:1}
.ts-endings{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;align-items:center}
.ts-endings h3{font-family:var(--f-label);font-weight:400;letter-spacing:.16em;font-size:14px;color:var(--ink-dim);margin:0;text-transform:uppercase}
.ts-endings .found{justify-content:center}
.chcard{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;background:radial-gradient(ellipse at center,rgba(20,8,8,.92),rgba(5,3,4,.97));cursor:pointer;animation:chin 3.2s ease forwards;padding:0 16px}
.chn{font-family:var(--f-label);letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-size:15px}
.cht{font-family:var(--f-display);font-size:clamp(44px,9vw,92px);line-height:1;color:#fff1dc;text-shadow:0 0 30px rgba(255,122,61,.5)}
.cha{font-style:italic;color:var(--ink-dim);font-size:18px}
@keyframes chin{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0;visibility:hidden}}

<script>
(function(){
const D = window.ASHBORN;
if(!D){ document.getElementById('stext').textContent = 'The story file failed to load. Reload the page to try again.'; return; }
const $ = s => document.querySelector(s);
const STATN = {might:'Might',cunning:'Cunning',charm:'Charm',lore:'Lore'};
const SAVE = 'ashborn.save.v1', ENDK = 'ashborn.endings.v1';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EVM = {}; D.events.forEach(e => EVM[e.id] = e);
const ENDINGS = Object.entries(D.scenes).filter(([k,v]) => v.ending).map(([k,v]) => ({id:k, kind:v.ending.kind, title:v.ending.title}));
let S = null, F = null, busy = false;

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick1 = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tx(v){
  if(typeof v === 'function') v = v(S);
  v = String(v ?? '');
  const m = S && S.sex === 'f';
  const map = {name:S?S.name:'You', heir:m?'princess':'prince', Heir:m?'Princess':'Prince', ruler:m?'queen':'king', Ruler:S?(m?'Queen':'King'):'Sovereign', child:m?'daughter':'son', gold:S?S.gold:0, influence:S?S.influence:0, army:S?S.army:0, lords:S?S.lords:0};
  return v.replace(/\{(\w+)\}/g, (x,k) => k in map ? map[k] : x);
}
function paras(str){
  return esc(str).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${p.replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}</p>`).join('');
}
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const save = () => { if(S) store.set(SAVE, S); };
const star = () => D.star(S);

/* =================== ART =================== */
const R = seed => { let a = seed; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; };
const lg = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map(([o,c,a=1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</linearGradient>`;
const rg = (id, stops, cx=.5, cy=.5, r=.5) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(([o,c,a=1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</radialGradient>`;
const flame = (x,y,s,d,a='#ff6a1a',b='#ffd27a') => `<g transform="translate(${x} ${y}) scale(${s})"><path class="flk" style="animation-delay:-${d}s" d="M0 0C-17-14-15-38 0-72C3-50 20-34 12-14C10-6 6-2 0 0Z" fill="${a}"/><path class="flk" style="animation-delay:-${(d+.4).toFixed(2)}s;animation-duration:1s" d="M0 0C-9-8-8-22 0-40C4-26 10-18 6-7C5-3 3-1 0 0Z" fill="${b}"/></g>`;
function pines(seed,n,y0,y1,hmin,hmax,col,cls=''){
  const r = R(seed); let s = '';
  for(let i=0;i<n;i++){ const x=r()*860-30, y=y0+r()*(y1-y0), h=hmin+r()*(hmax-hmin), w=h*.3;
    s += `<path class="${cls}" d="M${x.toFixed(1)} ${(y-h).toFixed(1)}L${(x-w*.45).toFixed(1)} ${(y-h*.5).toFixed(1)}L${(x-w*.25).toFixed(1)} ${(y-h*.5).toFixed(1)}L${(x-w*.75).toFixed(1)} ${(y-h*.18).toFixed(1)}L${(x-w*.45).toFixed(1)} ${(y-h*.18).toFixed(1)}L${(x-w).toFixed(1)} ${y}L${(x+w).toFixed(1)} ${y}L${(x+w*.45).toFixed(1)} ${(y-h*.18).toFixed(1)}L${(x+w*.75).toFixed(1)} ${(y-h*.18).toFixed(1)}L${(x+w*.25).toFixed(1)} ${(y-h*.5).toFixed(1)}L${(x+w*.45).toFixed(1)} ${(y-h*.5).toFixed(1)}Z" style="animation-delay:-${(r()*6).toFixed(1)}s"/>`; }
  return `<g fill="${col}">${s}</g>`;
}
function stars(seed,n,ymax=260){
  const r = R(seed); let s='';
  for(let i=0;i<n;i++) s += `<circle class="tw" cx="${(r()*800).toFixed(1)}" cy="${(r()*ymax).toFixed(1)}" r="${(.4+r()*1.3).toFixed(2)}" fill="#fff" style="animation-delay:-${(r()*3).toFixed(1)}s;animation-duration:${(2+r()*3).toFixed(1)}s"/>`;
  return s;
}
const hills = (y,amp,col) => `<path d="M0 400V${y}Q200 ${y-amp} 400 ${y}T800 ${y}V400Z" fill="${col}"/>`;
const crows = (seed,n,y0) => { const r=R(seed); let s=''; for(let i=0;i<n;i++){ const x=820+r()*400, y=y0+r()*60, k=.6+r()*.6; s+=`<path d="M${x} ${y}q${6*k} ${-6*k} ${12*k} 0q${6*k} ${-6*k} ${12*k} 0" stroke="#0b0b0e" stroke-width="2.4" fill="none"/>`; } return `<g class="fly">${s}</g>`; };

const ART = {
  fire(){ let cren=''; for(let x=240;x<560;x+=22) cren+=`<rect x="${x}" y="238" width="12" height="14"/>`;
    return `<defs>${lg('fS',[[0,'#12040a'],[.55,'#4a0d0c'],[1,'#b8380f']])}${rg('fG',[[0,'#ff8a2a',.8],[1,'#ff4d1a',0]],.5,1,.8)}</defs>
    <rect width="800" height="400" fill="url(#fS)"/>

    <ellipse class="pls" cx="400" cy="430" rx="560" ry="240" fill="url(#fG)"/>
    <g fill="#0a0406"><rect x="170" y="190" width="70" height="210"/><path d="M160 192L205 118L250 192Z"/><rect x="560" y="200" width="70" height="200"/><path d="M550 202L595 132L640 202Z"/>
    <rect x="330" y="130" width="140" height="270"/><path d="M318 132L400 46L482 132Z"/><rect x="240" y="250" width="320" height="150"/>${cren}<rect x="388" y="300" width="24" height="100" fill="#ff7a2a" opacity=".5"/></g>
    <g fill="#ffb347" class="win"><rect x="198" y="230" width="10" height="16"/><rect x="390" y="170" width="20" height="26"/><rect x="585" y="240" width="10" height="16"/></g>
    ${flame(205,195,1.1,0)}${flame(400,138,1.5,.6)}${flame(598,206,1,.3)}${flame(300,262,.9,.9)}${flame(480,252,1.2,.2)}${flame(110,345,1.5,.5)}${flame(700,330,1.7,.8)}
    <path d="M0 360Q200 338 400 366T800 350V400H0Z" fill="#070203"/>
    ${flame(250,392,1.9,.1)}${flame(560,398,2.1,.7)}${flame(40,400,1.6,.35)}${flame(770,400,1.4,.55)}`; },

  empress(){ return `<defs>${lg('eS',[[0,'#07040d'],[.6,'#1c0c2b'],[1,'#3a0f2a']])}${rg('eM',[[0,'#efe6ff',.95],[.55,'#b9a3e6',.35],[1,'#6b4bb3',0]])}${rg('eA',[[0,'#9b6bff',.55],[1,'#9b6bff',0]])}</defs>
    <rect width="800" height="400" fill="url(#eS)"/>${stars(5,60)}
    <circle class="pls2" cx="400" cy="150" r="170" fill="url(#eM)"/>
    <circle cx="400" cy="150" r="80" fill="#d8ccef" opacity=".85"/>

    <g fill="#050208">
      <path d="M400 140C352 150 334 172 324 204L292 400H508L476 204C466 172 448 150 400 140Z"/>
      <path d="M400 128C385 150 372 175 368 215C362 260 330 330 290 400H510C470 330 438 260 432 215C428 175 415 150 400 128Z"/>
      <ellipse cx="400" cy="112" rx="15" ry="19"/>
      <path d="M390 98C372 82 362 56 370 26C376 52 384 72 397 92Z"/><path d="M410 98C428 82 438 56 430 26C424 52 416 72 403 92Z"/>
      <path d="M386 97L389 80L394 93L400 68L406 93L411 80L414 97Z"/>
    </g>
    <g class="eye"><ellipse cx="394" cy="113" rx="3.4" ry="1.5" fill="#ff3b3b"/><ellipse cx="406" cy="113" rx="3.4" ry="1.5" fill="#ff3b3b"/></g>
    <g fill="#c4a2ff" font-size="22" font-family="serif">
      <text class="rune" x="210" y="230">&#5809;</text><text class="rune" x="570" y="210" style="animation-delay:-2s">&#5839;</text>
      <text class="rune" x="250" y="320" style="animation-delay:-4s">&#5814;</text><text class="rune" x="540" y="310" style="animation-delay:-1s">&#5833;</text>
      <text class="rune" x="160" y="140" style="animation-delay:-3s">&#5838;</text><text class="rune" x="640" y="120" style="animation-delay:-5s">&#5817;</text></g>
    <g class="fogd" fill="#1a0b26" opacity=".7"><ellipse cx="200" cy="390" rx="260" ry="34"/><ellipse cx="640" cy="395" rx="280" ry="30"/></g>
    <path d="M0 384Q400 356 800 384V400H0Z" fill="#030105"/>`; },

  forest(){ return `<defs>${lg('foS',[[0,'#050b10'],[.6,'#0d1d22'],[1,'#17302d']])}${rg('foM',[[0,'#d8ece4',.7],[1,'#d8ece4',0]])}</defs>
    <rect width="800" height="400" fill="url(#foS)"/>${stars(9,40,180)}

    ${pines(7,14,300,340,150,230,'#0a181b','sway-m')}
    ${pines(11,9,370,420,210,300,'#040b0c','sway-l')}
    <g class="drift" fill="#cfe3dc" opacity=".05"><ellipse cx="400" cy="360" rx="420" ry="30"/></g>`; },

  village(){ const r=R(21); let h=''; [[110,300,1],[230,318,.85],[400,296,1.1],[560,316,.9],[690,302,1]].forEach(([x,y,s],i)=>{
      h += `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-38" y="-34" width="76" height="40" fill="#120a10"/><path d="M-48 -32L0 -72L48 -32Z" fill="#0c070b"/><rect x="18" y="-80" width="10" height="26" fill="#0c070b"/>
      <rect class="win" x="-24" y="-24" width="13" height="14" fill="#ffb35c" style="animation-delay:-${i}s"/><rect class="win" x="10" y="-24" width="13" height="14" fill="#ffc77a" style="animation-delay:-${i*1.7}s"/>
      <circle class="smk" cx="23" cy="-86" r="7" fill="#5b4a5a" style="animation-delay:-${(r()*6).toFixed(1)}s"/><circle class="smk" cx="23" cy="-86" r="7" fill="#5b4a5a" style="animation-delay:-${(r()*6).toFixed(1)}s"/><circle class="smk" cx="23" cy="-86" r="6" fill="#5b4a5a" style="animation-delay:-${(r()*6).toFixed(1)}s"/></g>`; });
    return `<defs>${lg('vS',[[0,'#1a1030'],[.5,'#4a2340'],[1,'#d07a3a']])}${rg('vG',[[0,'#ffb35c',.7],[1,'#ffb35c',0]])}</defs>

    ${hills(270,40,'#2a1630')}${pines(4,16,280,300,60,110,'#1a0e1c')}
    ${hills(300,26,'#160b14')}${h}

class FX{
  constructor(cv, bg){ this.cv=cv; this.x=cv.getContext('2d'); this.p=[]; this.type=null; this.bg=bg; this.w=1; this.h=1; this.resize();
    if(window.ResizeObserver) new ResizeObserver(()=>this.resize()).observe(bg?document.documentElement:cv.parentElement); else addEventListener('resize',()=>this.resize());
    if(!RM) requestAnimationFrame(t=>this.loop(t)); }
  resize(){ const r = this.bg ? {width:innerWidth,height:innerHeight} : this.cv.parentElement.getBoundingClientRect(); const d=Math.min(devicePixelRatio||1,2);
    this.w=Math.max(1,r.width); this.h=Math.max(1,r.height); this.cv.width=this.w*d; this.cv.height=this.h*d; this.x.setTransform(d,0,0,d,0,0); }
  set(t){ if(t===this.type) return; this.type=t; this.p=[]; const n={embers:55,ash:60,snow:90,rain:120,motes:36,magic:44,fog:7,bg:26}[t]||0; for(let i=0;i<n;i++) this.p.push(this.make(true)); }
  make(init){ const w=this.w,h=this.h,t=this.type,M=Math.random; const p={x:M()*w,y:M()*h,ph:M()*6.28};
    if(t==='embers'||t==='bg'){ p.y=init?M()*h:h+5; p.vy=-(.3+M()*1.1)*(t==='bg'?.45:1); p.vx=(M()-.5)*.3; p.r=.6+M()*1.8; p.hue=12+M()*30; p.a=.45+M()*.55; }
    else if(t==='ash'){ p.y=init?M()*h:-5; p.vy=.2+M()*.5; p.vx=(M()-.5)*.4; p.r=.7+M()*1.7; }
    else if(t==='snow'){ p.y=init?M()*h:-5; p.vy=.35+M()*1.0; p.vx=(M()-.5)*.5; p.r=.8+M()*2.2; }
    else if(t==='rain'){ p.y=init?M()*h:-20; p.vy=9+M()*6; p.vx=-2; p.len=10+M()*14; }
    else if(t==='motes'){ p.vy=(M()-.5)*.25; p.vx=(M()-.5)*.25; p.r=.8+M()*1.6; }
    else if(t==='magic'){ p.y=init?M()*h:h+5; p.vy=-(.3+M()*.8); p.vx=0; p.r=.8+M()*2; p.amp=8+M()*24; p.bx=p.x; }
    else if(t==='fog'){ p.r=120+M()*170; p.vx=(M()<.5?-1:1)*(.08+M()*.14); p.vy=0; p.y=h*(.45+M()*.6); }
    return p; }
  loop(){ requestAnimationFrame(t=>this.loop(t)); const x=this.x,w=this.w,h=this.h; x.clearRect(0,0,w,h); const t=this.type; if(!t) return;
    x.globalCompositeOperation=(t==='embers'||t==='magic'||t==='bg'||t==='motes')?'lighter':'source-over';
    for(let i=0;i<this.p.length;i++){ const p=this.p[i]; p.ph+=.03;
      if(t==='magic') { p.y+=p.vy; p.x=p.bx+Math.sin(p.ph)*p.amp; } else { p.x+=p.vx+((t==='embers'||t==='bg'||t==='ash'||t==='snow')?Math.sin(p.ph)*.3:0); p.y+=p.vy; }
      if(t==='motes'){ if(p.x<-5)p.x=w+5; if(p.x>w+5)p.x=-5; if(p.y<-5)p.y=h+5; if(p.y>h+5)p.y=-5; }
      if(p.y<-40||p.y>h+40||p.x<-360||p.x>w+360){ const n=this.make(false); if(t==='fog') n.x=n.vx<0?w+250:-250; this.p[i]=n; continue; }
      if(t==='rain'){ x.strokeStyle='rgba(170,190,220,.32)'; x.lineWidth=1; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(p.x+p.vx*1.6,p.y-p.len); x.stroke(); }
      else if(t==='fog'){ const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,'rgba(180,170,190,.07)'); g.addColorStop(1,'rgba(180,170,190,0)'); x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
      else { let c;
        if(t==='embers'||t==='bg') c=`hsla(${p.hue},100%,62%,${(p.a*(.55+.45*Math.sin(p.ph*3))).toFixed(2)})`;
        else if(t==='ash') c='rgba(150,140,140,.55)'; else if(t==='snow') c='rgba(240,246,255,.8)';
        else if(t==='motes') c=`rgba(255,214,140,${(.25+.35*Math.sin(p.ph*2)).toFixed(2)})`; else c=`rgba(180,140,255,${(.35+.4*Math.sin(p.ph*2)).toFixed(2)})`;
        x.fillStyle=c; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
    } }
}

/* =================== EFFECTS =================== */
function eff(e){
  if(!e) return; if(typeof e==='function') e=e(S); if(!e) return;
  const T=[];
  for(const [k,v] of Object.entries(e)){
    if(k in S.stats){ const b=S.stats[k]; S.stats[k]=clamp(b+v,0,10); const d=S.stats[k]-b; if(d) T.push([`${d>0?'+':''}${d} ${STATN[k]}`, d>0?'up':'down']); }
    else if(k==='hp'){ const b=S.hp; S.hp=Math.min(S.maxhp,S.hp+v); const d=S.hp-b; if(d) T.push([`${d>0?'+':''}${d} Health`, d>0?'up':'down']); if(d<0){ flash('hurt'); shake(); } }
    else if(k==='maxhp'){ S.maxhp=Math.max(40,S.maxhp+v); if(v>0) S.hp+=v; S.hp=Math.min(S.hp,S.maxhp); T.push([`${v>0?'+':''}${v} Max health`, v>0?'up':'down']); }
    else if(k==='gold'||k==='influence'||k==='army'){ const b=S[k]; S[k]=Math.max(0,S[k]+v); const d=S[k]-b; if(d) T.push([`${d>0?'+':''}${d} ${k==='army'?'Soldiers':k==='gold'?'Gold':'Influence'}`, d>0?'up':'down']); }
    else if(k==='corruption'){ const b=S.corruption; S.corruption=clamp(b+v,0,100); const d=S.corruption-b; if(d) T.push([`${d>0?'+':''}${d} Corruption`,'dark']); }
    else if(k==='rel'){ for(const [p,x] of Object.entries(v)){ const b=S.rel[p]||0; S.rel[p]=clamp(b+x,-100,100); S.met[p]=1; const d=S.rel[p]-b; if(d) T.push([`${D.bondName(S,p)} ${d>0?'+':''}${d}`, d>0?'bond':'down']); } }
    else if(k==='meet'){ S.met[v]=1; }
    else if(k==='flag'){ [].concat(v).forEach(x=>S.flags[x]=1); }
    else if(k==='unflag'){ [].concat(v).forEach(x=>delete S.flags[x]); }
    else if(k==='item'){ [].concat(v).forEach(x=>{ S.items.push(x); T.push([`Gained: ${x}`,'item']); }); }
    else if(k==='noitem'){ [].concat(v).forEach(x=>{ const i=S.items.indexOf(x); if(i>-1){ S.items.splice(i,1); T.push([`Used: ${x}`,'down']); } }); }
    else if(typeof S[k]==='number' && typeof v==='number'){ S[k]+=v; }
    else S[k]=v;
  }
  T.forEach((t,i)=>setTimeout(()=>toast(t[0],t[1]), i*170));
  renderLedger();
}
function chance(c){ const ch=c.check; const b=ch.bonus?ch.bonus(S):0; return clamp(Math.round(50+(S.stats[ch.stat]+b-ch.dc)*12),5,95); }

/* =================== FLOW =================== */
function getScene(id){ return id && id.startsWith('ev:') ? EVM[id.slice(3)] : D.scenes[id]; }
function goTo(id){
  if(typeof id==='function') id=id(S);
  if(id==null) id = S.ret || 'end_young';
  if(id==='@return'){ id = S.ret || 'end_young'; S.ret=null; }
  if(id.startsWith('EVENT>')){
    const next=id.slice(6);
    const pool=D.events.filter(e=>!S.seen.includes(e.id)&&(!e.when||e.when(S)));
    if(!pool.length) return goTo(next);
    const e=pick1(pool); S.seen.push(e.id); S.ret=next; id='ev:'+e.id;
  }
  const sc=getScene(id); if(!sc){ console.error('Missing scene', id); return; }
  S.scene=id; S.outcome=null;
  enterScene(sc, true);
}
function enterScene(sc, fresh){
  let chChanged=false;
  if(fresh){
    if(sc.age!=null){ if(sc.age>S.age) S.hp=Math.min(S.maxhp, S.hp+15*Math.min(3,sc.age-S.age)); S.age=sc.age; }
    if(sc.ch && sc.ch!==S.ch){ chChanged = S.ch!==null || sc.ch==='Prologue'; S.ch=sc.ch; S.hp=Math.max(S.hp,S.maxhp); }
    if(sc.enter){ typeof sc.enter==='function' ? sc.enter(S) : eff(sc.enter); }
  }
  renderScene(sc); save(); renderLedger();
  if(chChanged) showChapter(S.ch);
}
function updateHeader(){
  if(!S) return;
  $('#hch').textContent = S.ch ? `${D.CHN[S.ch]}: ${D.CH[S.ch]}` : '';
  $('#hage').textContent = S.age===0 ? 'Newborn' : `Age ${S.age}`;
  $('#hud').innerHTML = `<span>Health <b>${Math.max(0,S.hp)}</b></span><span>Gold <b>${S.gold}</b></span>`;
}
function label(age, t){ $('#slabel').innerHTML = `<span class="sl-age">${esc(age)}</span><span class="sl-t">${esc(t)}</span>`; }
function scrollStory(){ const st=$('#stage'); const r=st.getBoundingClientRect(); if(r.top<0||r.top>innerHeight*.5) st.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'}); }

function renderScene(sc){
  F=null; busy=false;
  setArt(sc.art||'night', sc.fx);
  const title=tx(sc.title||'');
  label(sc.ending ? 'The End' : (S.age===0?'The night you were born':`Age ${S.age}`), title);
  updateHeader();
  const story=$('#story'); story.classList.remove('instant');
  if(sc.ending) return renderEnding(sc);
  const t=$('#stext'); t.className='stext scene reveal'; t.innerHTML=paras(tx(sc.text));
  const ps=[...t.children]; ps.forEach((p,i)=>p.style.animationDelay=(i*0.38)+'s');
  const ch=$('#choices'); ch.innerHTML=''; ch.className='choices reveal-c'; ch.style.animationDelay=(ps.length*0.38+0.15)+'s';
  const list=(sc.choices||[]).filter(c=>!c.if||c.if(S));
  list.forEach((c,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='choice';
    const locked = c.req && !c.req(S);
    let tag='';
    if(locked) tag=`<span class="tag lock">Locked · ${esc(tx(c.rq||'Requirements not met'))}</span>`;
    else if(c.check) tag=`<span class="tag chk s-${c.check.stat}">${STATN[c.check.stat]} check · ${chance(c)}% chance</span>`;
    else if(c.fight) tag=`<span class="tag fgt">Battle · ${esc(D.foes[c.fight].name)}</span>`;
    b.innerHTML=`<span class="key"><span>${i+1}</span></span><span class="cbody"><span class="ct">${esc(tx(c.t))}</span>${c.hint?`<span class="hint">${esc(c.hint)}</span>`:''}${tag}</span>`;
    if(locked) b.disabled=true; else b.addEventListener('click',()=>pick(c));
    ch.appendChild(b);
  });
  scrollStory();
}
async function pick(c){
  if(busy) return; busy=true;
  $('#story').classList.add('instant');
  S.log.push({age:S.age, t:tx(c.t)}); S.turns++;
  if(c.fight){ busy=false; return startFight(c); }
  let ok=true;
  if(c.check){ const p=chance(c); const r=rnd(1,100); ok=r<=p; await rollDice(r,p,ok); }
  busy=false; resolve(c, ok, !!c.check);
}
function resolve(c, ok, verdict){
  eff(c.e); eff(ok?c.win:c.lose);
  const out = ok ? c.out : (c.failOut!=null ? c.failOut : c.out);
  let next = ok ? c.go : (c.failGo!=null ? c.failGo : c.go);
  if(next==null && S.scene.startsWith('ev:')) next='@return';
  if(typeof next==='function') next=next(S);
  if(S.hp<=0 && !(typeof next==='string' && next.startsWith('end_'))) next='end_young';
  if(out){ S.outcome={text:tx(out), verdict: verdict?(ok?'success':'failure'):null, next}; save(); renderOutcome(); }
  else goTo(next);
}
function renderOutcome(){
  const o=S.outcome; const t=$('#stext'); t.className='stext reveal';
  t.innerHTML = (o.verdict?`<div class="verdict v-${o.verdict}">${o.verdict==='success'?'Success':'Failure'}</div>`:'') + `<div class="outcome">${paras(o.text)}</div>`;
  [...t.querySelectorAll('p')].forEach((p,i)=>p.style.animationDelay=(i*0.3)+'s');
  const ch=$('#choices'); ch.className='choices reveal-c'; ch.style.animationDelay='.35s';
  ch.innerHTML=`<div><button type="button" class="btn primary btn-continue">Continue</button></div>`;
  ch.querySelector('button').addEventListener('click',()=>{ const n=o.next; S.outcome=null; goTo(n); });
  updateHeader();
}
function rollDice(r,p,ok){
  return new Promise(res=>{
    const d=$('#dice'), n=$('#dnum'), cap=$('#dcap'); d.hidden=false; d.className='dice rolling'; cap.textContent=`Need ${p} or lower`;
    let k=0; const steps=RM?3:16;
    const iv=setInterval(()=>{ n.textContent=rnd(1,100); if(++k>=steps){ clearInterval(iv); n.textContent=r; d.className='dice '+(ok?'ok':'bad');
      cap.textContent=`${ok?'Success':'Failure'} · rolled ${r}, needed ${p} or lower`; if(!ok){ shake(); }
      setTimeout(()=>{ d.hidden=true; res(); }, RM?600:1150); } }, 55);
  });
}

/* =================== COMBAT =================== */
function startFight(c){
  const base=D.foes[c.fight]; const foe=Object.assign({},base);
  if(foe.undying){ if(S.flags.mortal){ foe.undying=false; foe.hp=80; } else if(S.flags.weakened){ foe.hp=Math.round(foe.hp*.6); } }
  F={c, foe, hp:foe.hp, max:foe.hp, turn:0, cd:0, guard:false, exposed:false, revived:false, done:false, won:null, log:[`${foe.name} faces you.`]};
  setArt(foe.art||'battle', foe.fx||'embers');
  label('Battle', foe.name);
  const t=$('#stext'); t.className='stext'; t.innerHTML=paras(tx(foe.desc||''));
  renderCombat(); scrollStory();
}
function heal(n){ const b=S.hp; S.hp=Math.min(S.maxhp,S.hp+n); return S.hp-b; }
function renderCombat(){
  const fo=F.foe, st=S.stats, hasS=star(), half=fo.undying&&!hasS;
  const draughts=S.items.filter(i=>i==='Healing Draught').length;
  const lo=5+st.might*2+(hasS?6:0), hi=lo+5;
  const fmt = (a,b) => half ? `${Math.round(a/2)}–${Math.round(b/2)}` : `${a}–${b}`;
  const acts=[
    ['strike','Strike',`Might · ${fmt(lo,hi)} damage`, true],
    ['feint','Feint',`Cunning · ${clamp(35+st.cunning*6,10,92)}% to land ${fmt(8+st.cunning*3+(hasS?6:0),14+st.cunning*3+(hasS?6:0))}`, true],
    ['guard','Guard',`Take 70% less from the next blow, recover ${4+st.might}`, true],
    ['arcane','Arcane Word', st.lore<3?`Needs Lore 3`:F.cd?`Recovering for ${F.cd} turn${F.cd>1?'s':''}`:`Lore · ${6+st.lore*3}–${12+st.lore*3}, pierces undying flesh`, st.lore>=3&&!F.cd],
    ['dark','Dark Power', S.corruption<20?`Needs Corruption 20`:`Corruption · ${Math.round(14+S.corruption/3)}+ damage, costs 6 health`, S.corruption>=20],
    ['draught','Healing Draught', draughts?`Restore 40 health · ${draughts} left`:`None in your satchel`, draughts>0]
  ];
  const fp=clamp(F.hp/F.max*100,0,100), yp=clamp(S.hp/S.maxhp*100,0,100);
  const warn = (!F.done && fo.heavy && ((F.turn+1)%3===0)) ? `<div class="cb-warn">${esc(fo.warn||`${fo.name} is winding up a heavy blow. Guard!`)}</div>` : '';
  const note = half ? `<div class="cb-note">She is Undying and you carry no star-iron. Steel does half damage, and she will rise once.</div>` : '';
  let bottom;
  if(F.done){
    bottom = `<div class="cb-result ${F.won?'':'lost'}">${F.won?'Victory':'Defeat'}</div><div><button type="button" class="btn primary btn-continue">Continue</button></div>`;
  } else {
    bottom = `<div class="cb-acts">${acts.map(([k,n,d,ok])=>`<button type="button" class="act a-${k}" data-act="${k}" ${ok?'':'disabled'}><b>${n}</b><span>${esc(d)}</span></button>`).join('')}</div>`;
  }
  const ch=$('#choices'); ch.className='choices';
  ch.innerHTML = `<div class="combat">
    <div class="cb-bars">
      <div class="cb-b foe"><div class="cb-n">${esc(fo.name)}</div><div class="bar"><i style="width:${fp}%"></i></div><div class="cb-num">${Math.max(0,F.hp)} / ${F.max}</div></div>
      <div class="cb-b you"><div class="cb-n">${esc(S.name)}</div><div class="bar"><i style="width:${yp}%"></i></div><div class="cb-num">${Math.max(0,S.hp)} / ${S.maxhp}</div></div>
    </div>${note}${warn}
    <ol class="cb-log">${F.log.slice(-4).map(l=>`<li>${esc(l)}</li>`).join('')}</ol>
    ${bottom}</div>`;
  if(F.done) ch.querySelector('.btn-continue').addEventListener('click',()=>{ const c=F.c, w=F.won; F=null; resolve(c,w,true); });
  else ch.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
  updateHeader(); renderLedger();
}
function act(type){
  if(!F||F.done||busy) return;
  const st=S.stats, hasS=star(), mult=(F.foe.undying&&!hasS)?.5:1, fo=F.foe;
  let dmg=0, msg='';
  if(type==='strike'){ dmg=Math.round((5+st.might*2+rnd(0,5)+(hasS?6:0))*mult); msg=`You strike for ${dmg}.`; }
  else if(type==='feint'){ const p=clamp(35+st.cunning*6,10,92); if(Math.random()*100<p){ dmg=Math.round((8+st.cunning*3+rnd(0,6)+(hasS?6:0))*mult); msg=`Your feint opens a gap. ${dmg} damage.`; } else { msg=`${fo.name} reads your feint. You're exposed.`; F.exposed=true; } }
  else if(type==='guard'){ F.guard=true; const h=heal(4+st.might); msg=`You set your feet and raise your guard${h?` (+${h} health)`:''}.`; }
  else if(type==='arcane'){ dmg=6+st.lore*3+rnd(0,6); F.cd=3; msg=`You speak a word from Ysolde's books. It burns for ${dmg}.`; }
  else if(type==='dark'){ dmg=Math.round(14+S.corruption/3+rnd(0,8)); S.hp-=6; S.corruption=clamp(S.corruption+3,0,100); msg=`You let the dark out. It tears into ${fo.name} for ${dmg}, and takes something from you too.`; }
  else if(type==='draught'){ const i=S.items.indexOf('Healing Draught'); if(i>-1) S.items.splice(i,1); const h=heal(40); msg=`You drink the draught. +${h} health.`; }
  if(dmg){ F.hp-=dmg; floatNum(dmg,'foe'); flash('hit'); }
  F.log.push(msg);
  if(F.hp<=0){
    if(fo.undying && !hasS && !F.revived && !S.flags.mortal){ F.revived=true; F.hp=Math.round(F.max*.5); F.log.push(`She stands back up. Of course she does. Without star-iron, her wounds close like water.`); }
    else { F.hp=0; F.done=true; F.won=true; F.log.push(`${fo.name} falls.`); return renderCombat(); }
  }
  F.turn++;
  const heavy = fo.heavy && F.turn%3===0;
  let d = heavy ? fo.heavy : rnd(fo.atk[0],fo.atk[1]);
  if(F.exposed){ d=Math.round(d*1.3); F.exposed=false; }
  if(F.guard){ d=Math.round(d*.3); F.guard=false; }
  S.hp-=d;
  F.log.push(heavy ? `${fo.heavyHit||'A crushing blow lands.'} (−${d})` : `${pick1(fo.hits)} (−${d})`);
  setTimeout(()=>{ floatNum(d,'you'); flash('hurt'); shake(); }, 260);
  if(F.cd>0 && type!=='arcane') F.cd--;
  if(S.hp<=0){ F.done=true; F.won=false; if(!fo.lethal) S.hp=Math.max(S.hp,15); F.log.push(fo.lethal?`You fall.`:`You go down, beaten.`); }
  renderCombat();
}

/* =================== ENDINGS =================== */
function recordEnding(id){ const got=store.get(ENDK)||[]; if(!got.includes(id)){ got.push(id); store.set(ENDK,got); } return got; }
function foundChips(got){ return `<div class="found">${ENDINGS.map(e=>got.includes(e.id)?`<span class="got k-${e.kind}">${esc(tx(e.title))}</span>`:`<span>???</span>`).join('')}</div>`; }
function renderEnding(sc){
  const e=sc.ending, kinds={victory:'Victory',dark:'Dark ending',death:'Death',bitter:'Bittersweet ending'};
  const got=recordEnding(S.scene);
  const t=$('#stext'); t.className='stext reveal';
  t.innerHTML=`<div class="end-kind k-${e.kind}">${kinds[e.kind]}</div><h3 class="end-title">${esc(tx(e.title))}</h3>${paras(tx(sc.text))}`;
  [...t.querySelectorAll('p')].forEach((p,i)=>p.style.animationDelay=(i*0.45)+'s');
  const st=S.stats;
  const rows=[['Age',S.age],['Might',st.might],['Cunning',st.cunning],['Charm',st.charm],['Lore',st.lore],['Gold',S.gold],['Influence',S.influence],['Soldiers',S.army],['Corruption',S.corruption],['Choices made',S.turns]];
  const road = [S.path?D.PATH_NAME[S.path]:null, S.design?`Plan: ${D.DESIGN_NAME[S.design]}`:null].filter(Boolean).join(' · ');
  const ch=$('#choices'); ch.className='choices reveal-c'; ch.style.animationDelay=(t.querySelectorAll('p').length*0.45+.3)+'s';
  ch.innerHTML=`<div class="chron">
    <h4>The chronicle of ${esc(S.name)}${road?` · ${esc(road)}`:''}</h4>
    <div class="chron-grid">${rows.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
    <h4>Turning points</h4>
    <ol>${S.log.slice(-10).map(l=>`<li><b>${l.age===0?'Newborn':'Age '+l.age}</b>${esc(l.t)}</li>`).join('')}</ol>
    <h4>Endings discovered · ${got.length} of ${ENDINGS.length}</h4>
    ${foundChips(got)}
    <div class="ts-btns"><button type="button" class="btn primary" id="btnAgain">Begin a new life</button></div>
  </div>`;
  $('#btnAgain').addEventListener('click',()=>{ store.del(SAVE); S=null; showTitle(); });
  store.del(SAVE);
  scrollStory();
}

/* =================== LEDGER =================== */
function pips(n){ let s=''; for(let i=1;i<=10;i++) s+=`<i class="${i<=n?'on':''}"></i>`; return `<span class="pips">${s}</span>`; }
function bondWord(v){ return v<=-50?'Hostile':v<=-15?'Wary':v<15?'Neutral':v<45?'Friendly':v<75?'Trusted':'Devoted'; }
function renderLedger(){
  if(!S) return;
  const st=S.stats, hpP=clamp(S.hp/S.maxhp*100,0,100);
  const bonds=Object.keys(S.rel).filter(k=>S.met[k]).map(k=>{ const v=S.rel[k]; const w=Math.abs(v)/2;
    return `<div class="bond"><div class="bond-top"><span>${esc(D.bondName(S,k))}</span><em>${bondWord(v)}</em></div><div class="bbar"><i class="${v>=0?'pos':'neg'}" style="width:${w}%"></i></div></div>`; }).join('');
  const counts={}; S.items.forEach(i=>counts[i]=(counts[i]||0)+1);
  const items=Object.entries(counts).map(([k,n])=>`<span class="${k.startsWith('Star-Iron')?'star':''}">${esc(k)}${n>1?` ×${n}`:''}</span>`).join('');
  const secrets=D.SECRETS.filter(([f])=>S.flags[f]).map(([,t])=>`<li>${esc(tx(t))}</li>`).join('');
  $('#ledger').innerHTML=`
    <div><div class="lg-name">${esc(S.name)}</div><div class="lg-title">${esc(D.titleOf(S))}</div></div>
    <div><div class="lg-cap">Health <span class="num">${Math.max(0,S.hp)} / ${S.maxhp}</span></div><div class="hpbar"><i style="width:${hpP}%"></i></div></div>
    <div><div class="lg-cap">Attributes</div>${['might','cunning','charm','lore'].map(k=>`<div class="stat s-${k}"><span>${STATN[k]}</span>${pips(st[k])}<b>${st[k]}</b></div>`).join('')}</div>
    <div class="res"><div><span>Gold</span><b>${S.gold}</b></div><div><span>Influence</span><b>${S.influence}</b></div><div><span>Soldiers</span><b>${S.army}</b></div><div><span>Oaths broken</span><b>${S.lords}/9</b></div>
      <div class="corr"><span>Corruption · ${S.corruption}</span><div class="cbar"><i style="width:${S.corruption}%"></i></div></div></div>
    <div><div class="lg-cap">Bonds</div>${bonds||'<div class="empty">No one yet.</div>'}</div>
    <div><div class="lg-cap">Satchel</div>${items?`<div class="items">${items}</div>`:'<div class="empty">Empty.</div>'}</div>
    <div><div class="lg-cap">Secrets learned</div>${secrets?`<ul class="secrets">${secrets}</ul>`:'<div class="empty">None yet.</div>'}</div>`;
  updateHeader();
}

/* =================== TITLE & CHAPTER =================== */
function showChapter(ch){
  const c=$('#chcard'); $('#chn').textContent=D.CHN[ch]; $('#cht').textContent=D.CH[ch]; $('#cha').textContent=S.age===0?'The night you were born':`Age ${S.age}`;
  c.hidden=false; c.style.animation='none'; void c.offsetWidth; c.style.animation='';
  const hide=()=>{ c.hidden=true; }; clearTimeout(showChapter.t); showChapter.t=setTimeout(hide, RM?1200:3200); c.onclick=hide;
}
function showTitle(){
  const ts=$('#titlescreen'); ts.hidden=false; $('#tsart').innerHTML=artSVG('fire');
  const sv=store.get(SAVE); const cont=$('#btnContinue'); cont.hidden=!(sv && sv.scene && !(D.scenes[sv.scene]||{}).ending);
  if(!cont.hidden) cont.textContent=`Continue as ${sv.name}`;
  const got=store.get(ENDK)||[];
  $('#tsEndings').innerHTML = `<h3>Endings discovered · ${got.length} of ${ENDINGS.length}</h3>${foundChips(got)}`;
  setTimeout(()=>{ try{ $('#inName').focus({preventScroll:true}); }catch(e){} }, 50);
}
$('#newform').addEventListener('submit',ev=>{
  ev.preventDefault();
  const name=($('#inName').value||'').trim().slice(0,18)||'Aren';
  const sex=$('#sexF').checked?'f':'m';
  S=D.newState(name,sex); $('#titlescreen').hidden=true; curArt=null; goTo('p1');
});
$('#btnContinue').addEventListener('click',()=>{ const sv=store.get(SAVE); if(!sv) return; S=sv; $('#titlescreen').hidden=true; resume(); });
function resume(){
  const sc=getScene(S.scene); if(!sc){ S=null; return showTitle(); }
  if(S.outcome){ setArt(sc.art||'night', sc.fx); label(S.age===0?'The night you were born':`Age ${S.age}`, tx(sc.title||'')); renderOutcome(); renderLedger(); }
  else enterScene(sc,false);
}
let restartArmed=false;
$('#btnRestart').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!restartArmed){ restartArmed=true; b.textContent='Tap again to restart'; setTimeout(()=>{ restartArmed=false; b.textContent='Restart'; }, 3000); return; }
  restartArmed=false; b.textContent='Restart'; store.del(SAVE); S=null; showTitle();
});
const ledger=$('#ledger'), scrim=$('#scrim');
$('#btnLedger').addEventListener('click',()=>{ ledger.classList.add('open'); scrim.hidden=false; });
scrim.addEventListener('click',()=>{ ledger.classList.remove('open'); scrim.hidden=true; });

/* stage parallax */
const stage=$('#stage');
stage.addEventListener('pointermove',e=>{ if(RM||e.pointerType!=='mouse') return; const r=stage.getBoundingClientRect(); const dx=((e.clientX-r.left)/r.width-.5)*-12, dy=((e.clientY-r.top)/r.height-.5)*-8; $('#art').style.setProperty('--px',dx+'px'); $('#art').style.setProperty('--py',dy+'px'); });
stage.addEventListener('pointerleave',()=>{ $('#art').style.setProperty('--px','0px'); $('#art').style.setProperty('--py','0px'); });
$('#stext').addEventListener('click',()=>$('#story').classList.add('instant'));

/* keyboard */
addEventListener('keydown',e=>{
  if(!S || !$('#titlescreen').hidden || e.target.tagName==='INPUT') return;
  if(!$('#chcard').hidden && (e.key==='Enter'||e.key===' ')){ $('#chcard').hidden=true; e.preventDefault(); return; }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    const btns=F ? [...document.querySelectorAll('.act:not([disabled])')] : [...document.querySelectorAll('#choices .choice')];
    const b=btns[n-1]; if(b && !b.disabled){ b.click(); e.preventDefault(); }
  } else if(e.key==='Enter'){ const c=document.querySelector('.btn-continue'); if(c){ c.click(); e.preventDefault(); } }
});

/* boot */
function start(data){
  if(data && data.S){ S=data.S; $('#titlescreen').hidden=true; resume(); }
  else showTitle();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
const hot = window.claude && window.claude.hot;
if(hot && typeof hot.ready==='function') hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
